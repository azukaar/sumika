version: '3.8'

services:
  sumika-dev:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    container_name: sumika-server-dev
    ports:
      - "8081:8081"
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - /dev:/dev
      - /mnt/e/work/Sumika/build-data12:/app/build-data
    privileged: true
    restart: unless-stopped
    environment:
      - TERM=xterm-256color
      - EXTERNAL_MQTT_BROKER=tcp://192.168.1.214:1883
